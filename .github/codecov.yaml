ignore:
  # The VS Code unit test coverage also reports the test files themselves
  - packages/kaoto-vscode/src/test
  - packages/kaoto-vscode/out-unit-tests

flag_management:
  # Each package uploads its coverage under a flag named after its directory (.github/workflows/build-lint-test.yml),
  # and these rules apply to every flag, so a new package needs no entry here.
  default_rules:
    # CI tests only the affected packages, so a flag that a commit doesn't upload keeps its last coverage.
    carryforward: true
  individual_flags:
    # The VS Code extension bundles the Kaoto UI, so its report covers the UI sources too.
    - name: kaoto-vscode
      paths:
        - packages/kaoto-vscode/src
