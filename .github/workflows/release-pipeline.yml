name: 🏷️ Release Pipeline, create a tag/release for Kaoto Next, publish the NPM and release a container image
on:
  workflow_dispatch:
    inputs:
      tag_version:
        type: string
        description: |
          The tag version we want to release without prefix (e.g. 2.0.0)
        required: true
      stable:
        type: boolean
        description: |
          Is this a stable release? If so we are going to tag also a stable container image to be used in the Kaoto Operator
        required: false
        default: true

jobs:
  tag-and-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ github.event.inputs.tag_version }}
          create_annotated_tag: true
          tag_prefix: ''

      - name: Create a GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}

  npm-release:
    permissions:
      id-token: write  # Required for OIDC
      contents: write
    runs-on: ubuntu-latest
    needs:
      - tag-and-release

    steps:
      - name: '🛰️ Checkout source code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          scope: '@kaoto'
          cache: 'yarn'

      # Install dependencies
      - name: 🔧 Install dependencies
        run: yarn install --immutable --mode=skip-build

      # Build lib
      - name: Build @kaoto/kaoto package in lib mode
        run: yarn workspace @kaoto/kaoto run build:lib

      # Version and publish
      - name: 'Version and publish'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          yarn publish

  container-image-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs:
      - tag-and-release
      - npm-release
    steps:
      - name: '🛰️ Checkout source code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          scope: '@kaoto'
          cache: 'yarn'

      # Install dependencies
      - name: 🔧 Install dependencies
        run: yarn install --immutable --mode=skip-build

      - name: '🔧 Build packages'
        run: |
          yarn workspaces foreach --verbose --all --topological-dev run build

      - name: '🛰️ Login to Container Registry'
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: '🔧 Build Container Image'
        shell: bash
        # Security: Prevent script injection by using environment variables instead of direct expression syntax.
        # The ${{ ... }} expression is evaluated when setting the env var (safely, as a value), and the shell
        # only sees ${GITHUB_EVENT_INPUTS_TAG_VERSION} as a variable reference. This ensures user input is
        # treated as data, not executable code, preventing injection attacks like: 2.0.0"; malicious-command; "
        # Reference: https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
        run: |
          docker build -t "quay.io/kaotoio/kaoto-app:${GITHUB_EVENT_INPUTS_TAG_VERSION}" .
        env:
          GITHUB_EVENT_INPUTS_TAG_VERSION: ${{ github.event.inputs.tag_version }}

      - name: '📤 Upload Container Image'
        shell: bash
        # Security: Prevent script injection by using environment variables instead of direct expression syntax.
        # The ${{ ... }} expression is evaluated when setting the env var (safely, as a value), and the shell
        # only sees ${GITHUB_EVENT_INPUTS_TAG_VERSION} as a variable reference. This ensures user input is
        # treated as data, not executable code, preventing injection attacks like: 2.0.0"; malicious-command; "
        # Reference: https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
        run: |
          docker push "quay.io/kaotoio/kaoto-app:${GITHUB_EVENT_INPUTS_TAG_VERSION}"
        env:
          GITHUB_EVENT_INPUTS_TAG_VERSION: ${{ github.event.inputs.tag_version }}

      - name: '🔧 Build Container Image'
        shell: bash
        run: |
          docker build -t "quay.io/kaotoio/kaoto-app:stable" .
        if: ${{ github.event.inputs.stable }}

      - name: '📤 Upload Container Image'
        shell: bash
        run: |
          docker push quay.io/kaotoio/kaoto-app:stable
        if: ${{ github.event.inputs.stable }}
