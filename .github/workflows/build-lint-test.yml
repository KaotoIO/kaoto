name: 📦 Build npm Package

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: monorepo-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build
      - name: Validate PR commits
        run: yarn commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # Every other job runs when a workspace it validates is affected. Yarn finds the workspaces that hold a file
  # changed since the base commit, and `--recursive` adds every workspace that depends on them, so a new
  # package or a new dependency between packages needs no change here.
  changes:
    name: Select CI jobs
    runs-on: ubuntu-latest
    outputs:
      # JSON arrays of workspace names: those that hold a changed file, and those plus their dependents.
      changed: ${{ steps.select.outputs.changed }}
      affected: ${{ steps.select.outputs.affected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'
      - name: Select affected workspaces
        id: select
        env:
          # The upstream base commit of a PR, or the commit before a push. A manual run has none.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Yarn ignores files outside the workspaces, such as yarn.lock, root configs and workflows, so a change
          # to one of them that isn't documentation selects every workspace. So does a run with nothing to
          # compare (a manual run or the first push of a branch) and a push that rewrote history: Yarn compares
          # with the merge base, so it can't see the changes that such a push removed.
          if [[ "$BASE" =~ ^0*$ ]] ||
            { [[ "$GITHUB_EVENT_NAME" == push ]] && ! git merge-base --is-ancestor "$BASE" HEAD; } ||
            ! git diff --quiet "$BASE...HEAD" -- . ':(exclude)packages/' ':(exclude)*.md' \
              ':(exclude)docs/' ':(exclude)_context/' ':(exclude)assets/readme/' ':(exclude).vscode/' \
              ':(exclude).github/ISSUE_TEMPLATE/' ':(exclude).github/PULL_REQUEST_TEMPLATE/'; then
            since=()
          else
            since=(--since="$BASE")
          fi
          # If Yarn fails, this step must fail rather than select no jobs: pipefail keeps Yarn's exit status
          # past jq, and each list gets its own assignment because set -e ignores a failure inside echo. A
          # workspace without a package name is listed by its path, which `--include` matches as well.
          set -o pipefail
          list() { yarn workspaces list "${since[@]}" "$@" --json | jq -sc 'map(select(.location != ".") | .name // .location)'; }
          changed=$(list)
          affected=$(list --recursive)
          {
            echo "changed=$changed"
            echo "affected=$affected"
          } | tee -a "$GITHUB_OUTPUT"

  # Lint, build and test each affected workspace in a job of its own, shown as e.g. "Packages (@kaoto/forms)",
  # with the workspace's own package.json scripts. Workspaces import each other from source (the
  # `@kaoto/source` condition), so no job needs another one's build. Yarn skips a script that a workspace
  # doesn't define, so a new package needs no change here.
  packages:
    name: Packages
    needs: changes
    if: needs.changes.outputs.affected != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.affected) }}
    runs-on: ubuntu-latest
    # As for the VSIX job of the VS Code workflow, so that a VS Code instance that hangs in the extension's tests
    # stops the job.
    timeout-minutes: 30
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.x'
          cache: yarn
      - name: Set up Java for Kompanion
        if: matrix.package == '@kaoto/kompanion'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # The tests of the VS Code extension start VS Code, which needs unprivileged user namespaces on Ubuntu and
      # a display. The display runs until the job ends; the other workspaces need neither.
      - name: Set up VS Code for the extension's tests
        if: matrix.package == 'vscode-kaoto'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          Xvfb :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build
      - name: Lint
        run: yarn workspaces foreach --all --include "$PACKAGE" run lint
      - name: Lint styles
        run: yarn workspaces foreach --all --include "$PACKAGE" run lint:style
      - name: Build
        run: yarn workspaces foreach --all --include "$PACKAGE" run build
      - name: Build libraries
        run: yarn workspaces foreach --all --include "$PACKAGE" run build:lib
      - name: Test
        run: yarn workspaces foreach --all --include "$PACKAGE" run test
      # Codecov gets the package's report under its own flag (.github/codecov.yaml). A new package needs an
      # upload and a flag of its own to report coverage.
      - name: Upload UI coverage
        if: hashFiles('packages/ui/coverage/lcov.info') != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/ui/coverage/lcov.info
          flags: ui
      - name: Upload forms coverage
        if: hashFiles('packages/forms/coverage/lcov.info') != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/forms/coverage/lcov.info
          flags: forms
      - name: Upload web coverage
        if: hashFiles('packages/kaoto-web/coverage/lcov.info') != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/kaoto-web/coverage/lcov.info
          flags: web
      - name: Upload VS Code coverage
        if: hashFiles('packages/kaoto-vscode/coverage/lcov.info') != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/kaoto-vscode/coverage/lcov.info
          flags: vscode
      # The logs of the VS Code instance that ran the extension's tests.
      - name: Upload VS Code test logs
        if: failure() && matrix.package == 'vscode-kaoto'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-logs
          path: packages/kaoto-vscode/.vscode-test/user-data/logs/*
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 2

  # The UI tests of the extension depend on it, so a change in the extension, its UI tests or a package the
  # extension embeds affects them. This job then builds the VSIX and runs the smoke test groups listed in
  # packages/ui-tests-vscode/package.json, or every group listed there if the extension or its UI tests changed
  # (KaotoIO/kaoto#3852). The extension's lint, build and unit tests run in its Packages job.
  vscode:
    name: VS Code
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.affected), '@kaoto/ui-tests-vscode')
    uses: ./.github/workflows/kaoto-vscode-build-lint-test.yml
    with:
      run-full-ui-tests: >-
        ${{ contains(fromJSON(needs.changes.outputs.changed), 'vscode-kaoto') ||
        contains(fromJSON(needs.changes.outputs.changed), '@kaoto/ui-tests-vscode') }}
      full-matrix: false

  # Cypress tests the UI through the end-to-end specs of the UI tests package.
  e2e:
    name: Cypress
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.affected), '@kaoto/kaoto-tests')
    uses: ./.github/workflows/e2e-tests.yml
    with:
      full-matrix: false
    secrets: inherit

  # Chromatic publishes the Storybook stories of the same package.
  chromatic:
    name: Chromatic
    needs: changes
    if: >-
      contains(fromJSON(needs.changes.outputs.affected), '@kaoto/kaoto-tests') &&
      (github.event_name != 'pull_request' || github.base_ref == 'main')
    uses: ./.github/workflows/chromatic.yml

  # Keep the existing required check name, including on documentation-only PRs.
  build:
    needs: [commitlint, changes, packages, vscode, e2e, chromatic]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check selected job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node .github/scripts/check-job-results.mjs
