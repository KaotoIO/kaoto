name: 🏗️ VS Code Kaoto Build

on:
  workflow_call:
    inputs:
      run-full-ui-tests:
        description: Run every UI test group listed in packages/ui-tests-vscode/package.json, not only the smoke groups
        required: true
        type: boolean
      full-matrix:
        description: Run tests on all OS platforms (Linux + macOS + Windows). When false, only Windows is used.
        required: false
        type: boolean
        default: true
    secrets:
      CODECOV_TOKEN:
        description: Token used to upload the unit test coverage to Codecov
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ui-test-matrix: ${{ steps.ui-test-matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select UI test groups
        id: ui-test-matrix
        uses: ./.github/actions/kaoto-vscode-ui-test-matrix
        with:
          full: ${{ inputs.run-full-ui-tests }}
          all-os: ${{ inputs.full-matrix }}

      - name: Setup tools
        uses: ./.github/actions/kaoto-vscode-setup-tools
        with:
          allow-unprivileged-userns: 'true'

      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build

      - name: Build webview, build and lint extension
        run: yarn workspace vscode-kaoto build:prod

      - name: Build and lint UI tests
        run: |
          yarn workspace @kaoto/ui-tests-vscode build
          yarn workspace @kaoto/ui-tests-vscode lint

      - name: Run unit tests
        run: xvfb-run -a yarn workspace vscode-kaoto test:unit --coverage

      - name: Upload unit test coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/kaoto-vscode/coverage/lcov.info
          flags: vscode

      - name: Build VSIX
        run: yarn workspace vscode-kaoto build:vsix --out kaoto-ci.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-kaoto-vsix
          path: packages/kaoto-vscode/kaoto-ci.vsix
          if-no-files-found: error
          retention-days: 2

      - name: Upload unit test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-logs
          path: packages/kaoto-vscode/.vscode-test/user-data/logs/*
          include-hidden-files: true
          retention-days: 2

  ui-tests:
    needs: build
    uses: ./.github/workflows/kaoto-vscode-ui-tests.yml
    with:
      vsix-artifact-name: vscode-kaoto-vsix
      matrix: ${{ needs.build.outputs.ui-test-matrix }}
