name: 🧪 VS Code Kaoto Integration Tests

on:
  workflow_call:
    inputs:
      vsix-artifact-name:
        description: Name of the VSIX artifact to download
        required: true
        type: string
      vsix-file:
        description: Filename of the VSIX inside the artifact (defaults to kaoto-ci.vsix)
        required: false
        type: string
        default: kaoto-ci.vsix
      matrix:
        description: The test groups and OSes to run, and whether each group needs JBang, as the JSON matrix from the kaoto-vscode-ui-test-matrix action
        required: true
        type: string
      retention-days:
        description: Number of days to retain uploaded test artifacts (logs, screenshots)
        required: false
        type: number
        default: 2

permissions:
  contents: read

jobs:
  # One job per test group and OS, so a run lists only the groups that run. The kaoto-vscode-ui-test-matrix action
  # builds the matrix from the `ciTestGroups` field in the package.json of @kaoto/ui-tests-vscode, which lists every
  # group, the smoke groups, the Linux-only ones and the ones that need no JBang (see that package's README).
  ui-tests:
    name: ${{ matrix.group }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A deploy job takes about 13 minutes, so a hung one ends after 40, with its logs uploaded below.
    timeout-minutes: ${{ matrix.group == 'deploy' && 40 || 60 }}
    env:
      CODE_VERSION: max # Latest stable VS Code version supported by ExTester UI testing framework
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/kaoto-setup-workspace
      - uses: ./.github/actions/kaoto-vscode-setup-tools
        with:
          install-jbang: ${{ matrix.jbang }}
          allow-unprivileged-userns: 'true'
      # Through Camel JBang the extension downloads Camel, its plugins and the dependencies of the test projects into
      # the local Maven repository, Citrus does the same, and JBang compiles the scripts it runs into its cache. Each
      # group caches both for its OS under a key made of the Camel catalog package, whose catalogs decide the Camel
      # versions the extension asks for, and the pom.xml files of the test projects. A new key starts from an empty
      # repository rather than an older entry, since Maven never removes what a group no longer uses. A group without
      # JBang downloads nothing there, and the nightly's scheduled run downloads everything again.
      - name: Restore Maven and JBang downloads
        id: downloads
        if: matrix.jbang && github.event_name != 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.jbang/cache
          key: ui-tests-maven-${{ runner.os }}-${{ runner.arch }}-${{ matrix.group }}-${{ hashFiles('node_modules/@kaoto/camel-catalog/package.json', 'packages/ui-tests-vscode/test Fixture with speci@l chars/**/pom.xml') }}
      # Before the tests ExTester downloads VS Code (about 410 MB) and ChromeDriver into the test folder and unpacks them,
      # unless the unpacked folders are already there in the versions it asks for. With CODE_VERSION max, its own version
      # decides those, so each OS keeps the two folders under a key made of ExTester's package.json. The VSIX under test,
      # VS Code's settings and the screenshots live in other folders, so every run still installs the freshly built VSIX,
      # and the nightly's scheduled run downloads VS Code and ChromeDriver again.
      - name: Restore VS Code and ChromeDriver
        id: vscode
        if: github.event_name != 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/kaoto-tests/VSCode-*
            ${{ runner.temp }}/kaoto-tests/chromedriver-*
          key: >-
            vscode-${{ runner.os }}-${{ runner.arch }}-${{ env.CODE_VERSION }}-${{
            hashFiles('node_modules/vscode-extension-tester/package.json',
            'packages/ui-tests-vscode/node_modules/vscode-extension-tester/package.json') }}
      - if: matrix.group == 'deploy'
        uses: ./.github/actions/kaoto-vscode-setup-minikube
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.vsix-artifact-name }}
          path: packages/ui-tests-vscode
      - name: Set display resolution
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Run ${{ matrix.group }} tests
        shell: bash
        env:
          KAOTO_DISABLE_WHATS_NEW: 'true'
          TEST_RESOURCES: ${{ runner.temp }}/kaoto-tests
          VSIX_FILE: ${{ inputs.vsix-file }}
          TEST_GROUP: ${{ matrix.group }}
        run: |
          # The deployment tests build their images in Minikube's Docker daemon.
          if [ "$TEST_GROUP" = deploy ]; then
            eval "$(minikube -p minikube docker-env)"
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a yarn workspace @kaoto/ui-tests-vscode "test:ui:vsix:$TEST_GROUP"
          else
            yarn workspace @kaoto/ui-tests-vscode "test:ui:vsix:$TEST_GROUP"
          fi
      # Only a push to main saves, after the group passed, so an entry holds everything the group downloads. A push
      # runs the groups and operating systems of a pull request, so the nightly's Linux and macOS groups, which only
      # the nightly would read, take up no cache storage.
      - name: Save Maven and JBang downloads
        if: matrix.jbang && steps.downloads.outputs.cache-hit != 'true' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.jbang/cache
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Save VS Code and ChromeDriver
        if: steps.vscode.outputs.cache-hit != 'true' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/kaoto-tests/VSCode-*
            ${{ runner.temp }}/kaoto-tests/chromedriver-*
          key: ${{ steps.vscode.outputs.cache-primary-key }}
      # Also when the job is cancelled, as it is at its timeout, so that a hung job leaves its logs.
      - name: Upload test artifacts
        if: failure() || cancelled()
        uses: ./.github/actions/kaoto-vscode-upload-test-artifacts
        with:
          test-group: ${{ matrix.group }}
          os-name: ${{ matrix.os }}
          storage-path: ${{ runner.temp }}/kaoto-tests
          retention-days: ${{ inputs.retention-days }}
