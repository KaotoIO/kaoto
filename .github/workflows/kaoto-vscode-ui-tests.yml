name: 🧪 VS Code Kaoto Integration Tests

on:
  workflow_call:
    inputs:
      vsix-artifact-name:
        description: Name of the VSIX artifact to download
        required: true
        type: string
      vsix-file:
        description: Filename of the VSIX inside the artifact (defaults to kaoto-ci.vsix)
        required: false
        type: string
        default: kaoto-ci.vsix
      run-full-ui-tests:
        description: Run all four integration test groups (views + export in addition to settings + editor)
        required: true
        type: boolean
      run-deploy-tests:
        description: Run Linux deployment tests with Minikube
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  settings:
    name: User Settings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/kaoto-vscode-setup-tools
        with:
          install-jbang: 'true'
          allow-unprivileged-userns: 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.vsix-artifact-name }}
          path: packages/kaoto-vscode
      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build
      - name: Set display resolution
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Run settings tests
        shell: bash
        env:
          KAOTO_DISABLE_WHATS_NEW: 'true'
          TEST_RESOURCES: ${{ runner.temp }}/kaoto-tests
          VSIX_FILE: ${{ inputs.vsix-file }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a yarn workspace vscode-kaoto test:ui:vsix:settings
          else
            yarn workspace vscode-kaoto test:ui:vsix:settings
          fi
      - name: Upload test artifacts
        if: failure()
        uses: ./.github/actions/kaoto-vscode-upload-test-artifacts
        with:
          test-group: settings
          os-name: ${{ matrix.os }}
          storage-path: ${{ runner.temp }}/kaoto-tests

  editor:
    name: Editor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/kaoto-vscode-setup-tools
        with:
          install-jbang: 'true'
          allow-unprivileged-userns: 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.vsix-artifact-name }}
          path: packages/kaoto-vscode
      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build
      - name: Set display resolution
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Run editor tests
        shell: bash
        env:
          KAOTO_DISABLE_WHATS_NEW: 'true'
          TEST_RESOURCES: ${{ runner.temp }}/kaoto-tests
          VSIX_FILE: ${{ inputs.vsix-file }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a yarn workspace vscode-kaoto test:ui:vsix:editor
          else
            yarn workspace vscode-kaoto test:ui:vsix:editor
          fi
      - name: Upload test artifacts
        if: failure()
        uses: ./.github/actions/kaoto-vscode-upload-test-artifacts
        with:
          test-group: editor
          os-name: ${{ matrix.os }}
          storage-path: ${{ runner.temp }}/kaoto-tests

  views:
    name: Views (${{ matrix.os }})
    if: inputs.run-full-ui-tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/kaoto-vscode-setup-tools
        with:
          install-jbang: 'true'
          allow-unprivileged-userns: 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.vsix-artifact-name }}
          path: packages/kaoto-vscode
      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build
      - name: Set display resolution
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Run views tests
        shell: bash
        env:
          KAOTO_DISABLE_WHATS_NEW: 'true'
          TEST_RESOURCES: ${{ runner.temp }}/kaoto-tests
          VSIX_FILE: ${{ inputs.vsix-file }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a yarn workspace vscode-kaoto test:ui:vsix:views
          else
            yarn workspace vscode-kaoto test:ui:vsix:views
          fi
      - name: Upload test artifacts
        if: failure()
        uses: ./.github/actions/kaoto-vscode-upload-test-artifacts
        with:
          test-group: views
          os-name: ${{ matrix.os }}
          storage-path: ${{ runner.temp }}/kaoto-tests

  export:
    name: Project Export (${{ matrix.os }})
    if: inputs.run-full-ui-tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/kaoto-vscode-setup-tools
        with:
          install-jbang: 'true'
          allow-unprivileged-userns: 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.vsix-artifact-name }}
          path: packages/kaoto-vscode
      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build
      - name: Set display resolution
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Run export tests
        shell: bash
        env:
          KAOTO_DISABLE_WHATS_NEW: 'true'
          TEST_RESOURCES: ${{ runner.temp }}/kaoto-tests
          VSIX_FILE: ${{ inputs.vsix-file }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a yarn workspace vscode-kaoto test:ui:vsix:export
          else
            yarn workspace vscode-kaoto test:ui:vsix:export
          fi
      - name: Upload test artifacts
        if: failure()
        uses: ./.github/actions/kaoto-vscode-upload-test-artifacts
        with:
          test-group: export
          os-name: ${{ matrix.os }}
          storage-path: ${{ runner.temp }}/kaoto-tests

  deployment:
    name: Deployment (ubuntu-latest)
    if: inputs.run-deploy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/kaoto-vscode-setup-tools
        with:
          install-jbang: 'true'
          allow-unprivileged-userns: 'true'
      - uses: ./.github/actions/kaoto-vscode-setup-minikube
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.vsix-artifact-name }}
          path: packages/kaoto-vscode
      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build
      - name: Run deployment tests
        env:
          KAOTO_DISABLE_WHATS_NEW: 'true'
          TEST_RESOURCES: ${{ runner.temp }}/kaoto-tests
          VSIX_FILE: ${{ inputs.vsix-file }}
        run: |
          eval "$(minikube -p minikube docker-env)"
          xvfb-run -a yarn workspace vscode-kaoto test:ui:vsix:deploy
      - name: Upload test artifacts
        if: failure()
        uses: ./.github/actions/kaoto-vscode-upload-test-artifacts
        with:
          test-group: deployment
          os-name: ubuntu-latest
          storage-path: ${{ runner.temp }}/kaoto-tests
