name: 🌙 Nightly Tests — full matrix on main

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# The workflows called here see the schedule event, and their jobs restore no cache for it: they install node_modules
# and the Cypress binary and download the UI test groups' Maven and JBang artifacts from the registries. Every other
# run restores them, and a hit never asks the registries, so a package or artifact that disappears upstream fails the
# nightly instead of the next release. A nightly started by hand uses the caches.
jobs:
  ui-e2e:
    name: UI E2E (all browsers)
    uses: ./.github/workflows/e2e-tests.yml
    with:
      full-matrix: true
      include-weekly-tests: true
    secrets: inherit

  vscode:
    name: VS Code integration (all platforms)
    uses: ./.github/workflows/kaoto-vscode-build-lint-test.yml
    with:
      run-full-ui-tests: true
      full-matrix: true
