name: 🚀 Build and Deploy main
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: 'deploy-main'
  cancel-in-progress: true

jobs:
  build-distribution:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: '🛰️ Checkout source code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '🛰️ Setup Node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          scope: '@kaoto'
          cache: 'yarn'

      # Install dependencies
      - name: 🔧 Install dependencies
        run: yarn install --immutable --mode=skip-build

      # Only the web application is deployed. Workspaces import each other from source, so it needs no other build.
      - name: '🔧 Build web application'
        run: yarn workspace @kaoto/kaoto build

      - name: '🔧 Tar UI Dist'
        shell: bash
        run: |
          tar -czf ${{ runner.temp }}/kaoto-ui.tgz -C packages/ui/dist .
          ls -lh ${{ runner.temp }}/kaoto-ui.tgz

      - name: '🔧 Persist UI Dist'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 'kaoto-ui-${{ github.run_id }}'
          path: '${{ runner.temp }}/kaoto-ui.tgz'
          retention-days: 1

  deploy-pages:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs:
      - build-distribution
    steps:
      - name: '🛰️ Checkout source code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '🛰️ Setup Pages'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: '🛰️ Download UI Dist'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kaoto-ui-${{ github.run_id }}
          path: '${{ runner.temp }}'

      - name: '🛰️ Extract UI Dist'
        shell: bash
        run: |
          mkdir -p packages/ui/dist
          tar -xzf "${{ runner.temp }}/kaoto-ui.tgz" -C packages/ui/dist

      - name: '📤 Upload artifact @kaoto/kaoto web application'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'packages/ui/dist'

      - name: '🚀 Deploy to GitHub Pages'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1 - it is the same as v5

  deploy-images:
    if: github.repository == 'KaotoIO/kaoto'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs:
      - build-distribution
    steps:
      - name: '🛰️ Checkout source code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '🛰️ Download UI Dist'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kaoto-ui-${{ github.run_id }}
          path: '${{ runner.temp }}'

      - name: '🛰️ Extract UI Dist'
        shell: bash
        run: |
          mkdir -p packages/ui/dist
          tar -xzf "${{ runner.temp }}/kaoto-ui.tgz" -C packages/ui/dist

      - name: '🛰️ Login to Container Registry'
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: '🔧 Build Container Image'
        shell: bash
        # TODO: the container image name should be configurable via vars/secrets
        run: |
          docker build -t "quay.io/kaotoio/kaoto-app:main" .

      - name: '📤 Upload Container Image'
        shell: bash
        run: |
          docker push quay.io/kaotoio/kaoto-app:main
