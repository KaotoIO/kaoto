name: Upload Test Artifacts (kaoto-vscode)
description: Uploads VS Code logs and screenshots from the kaoto-vscode test run when it failed or was cancelled

inputs:
  test-group:
    description: Test group used to distinguish artifacts from jobs on the same OS
    required: true
  os-name:
    description: OS name used for artifact naming (e.g. ubuntu, macos, windows)
    required: true
  storage-path:
    description: Path to the ExTester storage directory (matches TEST_RESOURCES env var)
    required: true
  retention-days:
    description: Number of days to retain uploaded artifacts
    required: false
    default: '2'

runs:
  using: composite
  steps:
    # The caller runs this action only when the job failed or was cancelled. always() keeps both
    # uploads going when the job is cancelled during an upload, for example by a newer push.
    - name: Upload VS Code logs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: vscode-logs-${{ inputs.test-group }}-${{ inputs.os-name }}
        path: ${{ inputs.storage-path }}/settings/logs
        retention-days: ${{ inputs.retention-days }}

    - name: Upload test screenshots
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ui-test-screenshots-${{ inputs.test-group }}-${{ inputs.os-name }}
        path: ${{ inputs.storage-path }}/screenshots
        retention-days: ${{ inputs.retention-days }}
