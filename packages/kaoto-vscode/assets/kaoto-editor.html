<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="__KAOTO_CSP__" />
    <title>Kaoto</title>
    <link rel="stylesheet" href="__KAOTO_STYLESHEET__" />
    <style nonce="__KAOTO_NONCE__">
      /* The editor stylesheet reserves space for a standalone header. The webview fills its panel. */
      html,
      body,
      #envelope-app {
        margin: 0;
        border: 0;
        padding: 0;
        height: 100%;
      }

      html body {
        block-size: 100%;
        overflow: hidden;
      }

      .kaoto-loading {
        box-sizing: border-box;
        display: grid;
        min-height: 100%;
        place-items: center;
        padding: 32px;
        background: var(--vscode-editor-background, #1e1e1e);
        color: var(--vscode-editor-foreground, #cccccc);
        font-family: var(--vscode-font-family, sans-serif);
      }

      .kaoto-loading__content {
        display: block;
        width: min(100%, 320px);
        text-align: center;
      }

      .kaoto-loading__mark {
        display: grid;
        width: 56px;
        height: 56px;
        margin: 0 auto 24px;
        place-items: center;
        border: 1px solid var(--vscode-widget-border, #565656);
        border-radius: 16px;
        background: var(--vscode-sideBar-background, #252526);
      }

      .kaoto-loading__mark::before {
        content: '';
        width: 22px;
        height: 22px;
        border: 4px solid var(--vscode-progressBar-background, #3794ff);
        border-right-color: transparent;
        border-radius: 50%;
        animation: kaoto-loading-spin 1.1s linear infinite;
      }

      .kaoto-loading__title {
        display: block;
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .kaoto-loading__message {
        display: block;
        margin: 8px 0 24px;
        color: var(--vscode-descriptionForeground, #999999);
        font-size: 13px;
      }

      .kaoto-loading__track {
        display: block;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: var(--vscode-widget-border, #565656);
      }

      .kaoto-loading__track::before {
        content: '';
        display: block;
        width: 35%;
        height: 100%;
        border-radius: inherit;
        background: var(--vscode-progressBar-background, #3794ff);
        animation: kaoto-loading-progress 1.5s ease-in-out infinite alternate;
      }

      @keyframes kaoto-loading-spin {
        to { transform: rotate(360deg); }
      }

      @keyframes kaoto-loading-progress {
        to { transform: translateX(190%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .kaoto-loading__mark::before,
        .kaoto-loading__track::before { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="envelope-app" data-file-extension="__KAOTO_FILE_EXTENSION__" data-resources-path-prefix="__KAOTO_RESOURCES_PATH_PREFIX__">
      <output class="kaoto-loading">
        <span class="kaoto-loading__content">
          <span class="kaoto-loading__mark" aria-hidden="true"></span>
          <span class="kaoto-loading__title">Kaoto</span>
          <span class="kaoto-loading__message">Loading Kaoto editor…</span>
          <span class="kaoto-loading__track" aria-hidden="true"></span>
        </span>
      </output>
    </div>
    <script type="module" nonce="__KAOTO_NONCE__" src="__KAOTO_SCRIPT__"></script>
  </body>
</html>
