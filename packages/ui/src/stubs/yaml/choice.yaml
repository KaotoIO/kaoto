- route:
    from:
      uri: direct
      parameters:
        name: start
      steps:
        - unmarshal:
            json:
              library: Jackson
        - setHeader:
            constant:
              id: kosnstanta
              expression: blabla
              trim: 'true'
            name: meno
        - choice:
            id: cojsa
            otherwise:
              steps:
                - log:
                    message: Other fruits
                - choice:
                    id: cojsa2
                    when:
                      - simple:
                          expression: ${body} contains 'Apple'
                        steps:
                          - log:
                              message: Apple branch
                          - to:
                              uri: mock
                              parameters:
                                name: result
                - to:
                    uri: mock
                    parameters:
                      name: result
            when:
              - steps:
                  - log:
                      message: Apple branch
                  - to:
                      uri: mock
                      parameters:
                        name: result
                simple:
                  expression: ${body} contains 'Apple'
              - steps:
                  - log:
                      message: Banana branch
                  - to:
                      uri: mock
                      parameters:
                        name: result
                simple:
                  expression: ${body} contains 'Banana'
              - steps:
                  - log:
                      message: Cherry branch
                  - to:
                      uri: mock
                      parameters:
                        name: result
                simple:
                  id: houno
                  expression: ${body} contains 'Cherry'
        - log:
            message: Choice processing complete
        - to:
            uri: mock
            parameters:
              name: result
- route:
    from:
      uri: timer
      parameters:
        timerName: cherryTimer
        period: 1000
      steps:
        - setBody:
            constant:
              expression: Cherry
        - setHeader:
            constant:
              expression: Spain
            name: Fruit-Origin
        - setHeader:
            constant:
              expression: Premium
            name: Fruit-Quality
        - setHeader:
            constant:
              expression: Summer
            name: Fruit-Season
        - setHeader:
            constant:
              expression: '2.75'
            name: Fruit-Price
        - to:
            uri: direct
            parameters:
              name: start
- route:
