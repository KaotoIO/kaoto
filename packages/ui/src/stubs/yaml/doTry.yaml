- route:
    id: 'route-1137'
    from:
      uri: 'direct'
      parameters:
        name: 'start'
      steps:
        - doTry:
            steps:
              - process:
                  ref: 'processorFail'
              - to:
                  uri: 'mock'
                  parameters:
                    name: 'result'
            doCatch:
              - id: 'first'
                exception:
                  - 'java.io.IOException'
                  - 'java.lang.IllegalStateException'
                onWhen:
                  simple:
                    expression: "${exception.message} contains 'Damn'"
                steps:
                  - to:
                      uri: 'mock'
                      parameters:
                        name: 'catch'
              - id: 'second'
                exception:
                  - 'org.apache.camel.CamelExchangeException'
                steps:
                  - to:
                      uri: 'mock'
                      parameters:
                        name: 'catchCamel'
            doFinally:
              steps:
                - to:
                    uri: 'mock'
                    parameters:
                      name: 'finally'
