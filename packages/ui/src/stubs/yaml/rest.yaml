- rest:
    securityDefinitions:
      oauth2:
        flow: application
        key: oauth2
        scopes:
          - key: '{{oauth.scope.service.self}}'
            value: '{{oauth.scope.service.self}}'
          - key: '{{oauth.scope.test.person.data}}'
            value: '{{oauth.scope.test.person.data}}'
        tokenUrl: '{{oauth.token.url}}'
    get:
      - param:
          - name: name
            required: 'true'
            type: query
          - defaultValue: blah
            name: name2
            required: 'true'
            type: query
        path: /hello
        responseMessage:
          - code: '200'
            examples:
              - key: example
                value: value
              - key: example
                value: value
            header:
              - description: header
                allowableValues:
                  - value: '1'
                  - value: '2'
                name: header
            message: hello
        security:
          - key: hello
            scopes: scope
        to:
          uri: direct
          parameters:
            name: hello
      - consumes: application/json
        path: /bye
        to:
          uri: direct
          parameters:
            name: bye
    path: /say
    post:
      - path: /bye
        to:
          uri: mock
          parameters:
            name: update
