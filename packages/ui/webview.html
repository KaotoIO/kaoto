<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="__KAOTO_CSP__" />
  <title>Kaoto</title>
  <!-- The editor styles only arrive once its modules load: this stylesheet draws the loader below meanwhile -->
  <link rel="stylesheet" href="/src/webview/webview-shell.scss" />
  <style>
    /* The editor stylesheet reserves space for a standalone header. The webview fills its panel. */
    html,
    body,
    #kaoto-editor {
      margin: 0;
      border: 0;
      padding: 0;
      height: 100%;
    }

    html body {
      block-size: 100%;
      overflow: hidden;
    }

    /*
     * Mirrors the full page Loading component of the UI with Carbon classes and tokens only, so the loader does not
     * change when the editor takes over. The Carbon styles come from `webview-shell.scss`.
     */
    .kaoto-loading {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--cds-spacing-05, 1rem);
      padding: var(--cds-spacing-07, 2rem);
      min-block-size: 100vh;
    }

    .kaoto-loading__message {
      margin: 0;
      color: var(--cds-text-primary);
      font-size: var(--cds-heading-03-font-size, 1.25rem);
      font-weight: var(--cds-heading-03-font-weight, 400);
      line-height: var(--cds-heading-03-line-height, 1.4);
      letter-spacing: var(--cds-heading-03-letter-spacing, 0);
    }
  </style>
</head>

<body>
  <div id="kaoto-editor" data-file-extension="__KAOTO_FILE_EXTENSION__"
    data-resources-path-prefix="__KAOTO_RESOURCES_PATH_PREFIX__">
    <div class="kaoto-loading">
      <div aria-atomic="true" aria-live="assertive" class="cds--loading">
        <svg class="cds--loading__svg" viewBox="0 0 100 100" role="img" aria-label="Loading">
          <title>Loading</title>
          <circle class="cds--loading__stroke" cx="50%" cy="50%" r="44"></circle>
        </svg>
      </div>
      <p class="kaoto-loading__message">Loading Kaoto editor...</p>
    </div>
  </div>
  <script nonce="__KAOTO_NONCE__" src="__KAOTO_HOST_SHIM__"></script>
  <script type="module" nonce="__KAOTO_NONCE__" src="/src/webview/start.tsx"></script>
</body>

</html>
