camel.main.name = file-main
camel.main.routes-include-pattern = classpath:camel/*.camel.yaml
# the backlog tracer is only woven into the routes at startup: standby lets the trace action turn it on later
camel.trace.standby = true
# the camel-cli-connector file transport is on by default; its directory is ${user.home}/.camel, which the test sets
