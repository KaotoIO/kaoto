quarkus.http.port=0
quarkus.http.host=127.0.0.1
quarkus.package.jar.type=uber-jar

# Long-poll timeout for command acks (overridable via -Dkaoto.kompanion.command.ack-timeout=Xs)
kaoto.kompanion.command.ack-timeout=10s
# How long a command waits for the worker's first frame (protocol detection) before answering 503
kaoto.kompanion.worker.protocol-timeout=5s
# Frames buffered per SSE subscriber; snapshots are superseded instead of buffered
kaoto.kompanion.events.buffer=4096
# When set, workers must send it as bearer token at the handshake (-Dkaoto.kompanion.worker-token=...)
# kaoto.kompanion.worker-token=

# OpenAPI
quarkus.smallrye-openapi.info-title=Kaoto Kompanion API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.store-schema-directory=../dist/openapi

# Workers (camel-cli-connector) send the status snapshot whole; the default limit (256 KB) closes the connection
quarkus.websockets-next.server.max-message-size=16777216
