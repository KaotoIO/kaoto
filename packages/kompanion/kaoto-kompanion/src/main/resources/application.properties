quarkus.http.port=0
quarkus.http.host=127.0.0.1
quarkus.package.jar.type=uber-jar

# Long-poll timeout for command acks (overridable via -Dkaoto.kompanion.command.ack-timeout=Xs)
kaoto.kompanion.command.ack-timeout=10s
# A command answered 202 is kept for polling: its result for result-ttl once it has one, failed after
# pending-timeout without an answer, and at most max-results per execution (the oldest results go first)
kaoto.kompanion.command.result-ttl=10m
kaoto.kompanion.command.pending-timeout=10m
kaoto.kompanion.command.max-results=10000
# How long a command waits for the worker's first frame (protocol detection) before answering 503
kaoto.kompanion.worker.protocol-timeout=5s
# Events kept per execution for the SSE clients, which read them at their own pace (states: only the latest value)
kaoto.kompanion.events.buffer=4096
kaoto.kompanion.events.buffer-bytes=33554432
# Fields left out when telling whether a slice (per route) changed, at any depth, e.g. uptime (none by default)
# kaoto.kompanion.events.slice-ignore-fields=
# How long a feature turned on for SSE clients (ensure=trace,debug) stays on after the last one is gone
kaoto.kompanion.demand.release-delay=0s
# When set, workers must send it as bearer token at the handshake (-Dkaoto.kompanion.worker-token=...)
# kaoto.kompanion.worker-token=

# Camel apps on the camel-cli-connector file transport (the default one) are discovered from the files in
# <camel-home>/.camel (camel-home defaults to user.home, as Camel). Set enabled=false to turn it off
kaoto.kompanion.file-transport.enabled=true
# kaoto.kompanion.file-transport.camel-home=
# How often the directory is scanned for apps, and the files of each app polled
kaoto.kompanion.file-transport.scan-interval=1s
kaoto.kompanion.file-transport.poll-interval=100ms
# An app whose status file is not updated for this long is dropped (the connector rewrites it every second)
kaoto.kompanion.file-transport.stale-after=30s
# How long an action file may wait for the connector before it is taken back
kaoto.kompanion.file-transport.action-timeout=60s

# OpenAPI
quarkus.smallrye-openapi.info-title=Kaoto Kompanion API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.store-schema-directory=../dist/openapi

# Workers (camel-cli-connector) send the status snapshot whole; the default limit (256 KB) closes the connection
quarkus.websockets-next.server.max-message-size=16777216
